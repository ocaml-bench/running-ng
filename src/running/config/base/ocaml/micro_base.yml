# Modifiers, referenced by name in pipe-separated config strings (e.g. "ocaml-release|time_stats|s-32768").

modifiers:
  time_stats:
    type: Wrapper
    val: "/usr/bin/time -f \"%Uuser %Ssystem %eelapsed %PCPU (%Xavgtext+%Davgdata %Mmaxresident)k\""
  olly_gc:
    type: Wrapper
    val: "olly gc-stats"

  # Freezes the child (SIGSTOP/SIGCONT) so perf stat and olly attach before any code
  # runs; needs perf and olly on PATH. Run one group at a time to avoid PMU multiplexing.
  perf_grp1:
    type: PerfAndOllyAttach
    val: "task-clock,page-faults,cycles,instructions"
    # hwpmc event names, used instead of val on FreeBSD.
    val_freebsd: "instructions,unhalted-cycles,PAGE_FAULT.ALL"
  perf_grp2:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,stalled-cycles-frontend,stalled-cycles-backend"
    val_freebsd: "instructions,unhalted-cycles,idq_uops_not_delivered.core,resource_stalls.any"
  perf_grp3:
    type: PerfAndOllyAttach
    val: "task-clock,cycles,cache-misses,LLC-load-misses,dTLB-load-misses,iTLB-load-misses"
    val_freebsd: "instructions,unhalted-cycles,longest_lat_cache.miss,mem_load_uops_retired.l3_miss,dtlb_load_misses.walk_completed,itlb_misses.walk_completed"

  # FreeBSD groups: pmcstat is all-or-nothing (one unresolvable name exits 71 with no
  # output) and only `instructions` of the Linux names resolves, so separate groups
  # keep the config string honest about what ran. Ceiling is 7 events (3 fixed + 4
  # programmable with SMT on) and hwpmc never multiplexes, it fails instead.
  # task-clock has no exact equivalent and is dropped (olly cpu_time covers it);
  # page-faults maps to the soft PMC PAGE_FAULT.ALL, which costs no hardware counter.
  # PmcStatBackend.EVENT_ALIASES canonicalises `unhalted-cycles` to `cycles`.
  perf_grp1_freebsd:
    type: PerfAndOllyAttach
    val: "instructions,unhalted-cycles,PAGE_FAULT.ALL"
  # Approximations of perf's stalled-cycles-*; not comparable with Linux numbers.
  perf_grp2_freebsd:
    type: PerfAndOllyAttach
    val: "instructions,unhalted-cycles,idq_uops_not_delivered.core,resource_stalls.any"
  # mem_load_uops_retired.l3_miss counts retired load uops, not requests: not comparable
  # with Linux LLC-load-misses. Do not add llc-misses: same counter as
  # longest_lat_cache.miss and it would burn one of four programmable slots (group is at the ceiling).
  perf_grp3_freebsd:
    type: PerfAndOllyAttach
    val: "instructions,unhalted-cycles,longest_lat_cache.miss,mem_load_uops_retired.l3_miss,dtlb_load_misses.walk_completed,itlb_misses.walk_completed"

  # gc_verbose prints GC stats at exit. OxCaml moved the STATS bit: stock OCaml v=0x400,
  # OxCaml v=0x1000; the wrong one silently prints nothing (stock) or address-space
  # messages (OxCaml). Pick the modifier matching the runtime.
  gc_verbose:
    type: OCamlRunParam
    val: "v=0x400"
  gc_verbose_oxcaml:
    type: OCamlRunParam
    val: "v=0x1000"
  s:
    type: OCamlRunParam
    val: "s={0}"
  o:
    type: OCamlRunParam
    val: "o={0}"
  a:
    type: OCamlRunParam
    val: "a={0}"
  # runtime_events ring, log2 words per domain (default 16). Events file = max_domains
  # * 2^e * 8 bytes: e=21 at the default d=128 is 2GB and fails ftruncate, so pair with md.
  re:
    type: OCamlRunParam
    val: "e={0}"
  # Max domains; set to main + spawned to shrink the events file.
  md:
    type: OCamlRunParam
    val: "d={0}"

