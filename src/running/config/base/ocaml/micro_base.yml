# Micro/multicore benchmark base: sandmark-derived suites under ${RUNNING_BENCH_DIR}
# (~/micro-benches), the standard modifiers (perf groups, olly, OCAMLRUNPARAM templates) and
# the enabled-benchmark list. Experiments include it with
#   includes: ["../base/ocaml/micro_base.yml"]
# and define runtimes, configs, config_sweep and invocations themselves.
# Run: running-env/bin/python -m running runbms LOG_DIR <experiment>.yml
#
# Program args mirror micro-benches' manifest.yml and are sized so every program runs
# >= 1 s (about 2 s on an Apple M5); shorter runs exit before olly/perf can attach.

# Suites. OCamlMulticoreBenchmarkSuite enforces OCaml >= 5 at build time;
# OCamlBenchmarkSuite builds on any version.

# Inherited by every including config; a top-level redeclaration in an experiment is
# a combine() TypeError, use overrides:.
# schema_version emits contract/{manifest.json,measurements/} inline during runbms.
# compress_logs must stay false: absent it defaults to true and gzips every sidecar.
schema_version: "1.0"
compress_logs: false

suites:
  # simple/ (stdlib-only sequential)
  sandmark-sequential:
    type: OCamlBenchmarkSuite
    timeout: 120
    programs:
