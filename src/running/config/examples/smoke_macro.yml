# Smoke test of the macro path: cpdf_squeeze_default + sedlex_tokenize_default under
# OCaml 5.5.1, 1 invocation. Includes macro_base.yml. Both are default_run rungs, so a
# bare run (no RUNNING_TAG) selects them.
# Run:
#   RUNNING_MACRO_BENCH_DIR=~/macro-benches \
#   CONFIG_FILE=src/running/config/examples/smoke_macro.yml \
#   LOG_DIR=/tmp/smoke_macro \
#     bash run_ocaml_bench_gc_sweep.sh

includes:
  - "../base/ocaml/macro_base.yml"

overrides:
  invocations: 1
  benchmarks:
    macro-cpdf-monorepo:
      - cpdf_squeeze_default
    macro-sedlex:
      - sedlex_tokenize_default

runtimes:
  ocaml-5.5.1:
    type: OCaml
    version: "5.5.1"

configs:
  - "ocaml-5.5.1|perf_grp1"
